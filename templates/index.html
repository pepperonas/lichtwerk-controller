<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lichtwerk Controller</title>
    <link rel="stylesheet" href="/shared/theme.css">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="manifest" href="static/site.webmanifest">
    <meta name="theme-color" content="#2B2E3B">
<style>
    /* MD3 Expressive Animations (2026-06-16) */
    :root {
        --md-ease-spatial: linear(0,0.009 1.2%,0.035 2.5%,0.158 6%,0.793 18.4%,0.984 23%,1.07 27%,1.104 31.5%,1.103 35%,1.07 41%,1.013 50%,0.991 57%,0.998 75%,1);
        --md-ease-effects: cubic-bezier(0.2,0,0,1);
    }
    @keyframes md-enter { from{opacity:0;transform:translateY(24px) scale(.96)} to{opacity:1;transform:none} }
    @keyframes md-breathe { 0%,100%{box-shadow:0 0 0 0 rgba(170,199,255,0)} 50%{box-shadow:0 0 26px 2px rgba(170,199,255,.35)} }
    @keyframes md-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.7)} }

    /* Staggered card / panel entrance */
    .control-section { animation: md-enter .5s var(--md-ease-spatial) backwards; }
    .control-section:nth-child(1) { animation-delay: .04s; }
    .control-section:nth-child(2) { animation-delay: .10s; }
    .control-section:nth-child(3) { animation-delay: .16s; }
    .control-section:nth-child(4) { animation-delay: .22s; }
    .control-section:nth-child(5) { animation-delay: .28s; }
    .control-section:nth-child(6) { animation-delay: .34s; }

    /* Buttons: effect / color presets / power */
    .effect-btn,
    .color-preset,
    .power-button {
        transition: transform .4s var(--md-ease-spatial),
                    box-shadow .2s var(--md-ease-effects),
                    filter .2s var(--md-ease-effects);
    }
    .effect-btn:active,
    .color-preset:active,
    .power-button:active { transform: scale(.95); }
    .effect-btn:hover,
    .color-preset:hover,
    .power-button:hover { transform: translateY(-2px); filter: brightness(1.06); }

    /* Active effect highlighted with a breathing glow */
    .effect-btn.active { animation: md-breathe 2.6s ease-in-out infinite; }

    /* Connection / status dot pulses */
    .status-dot { animation: md-pulse 2s ease-in-out infinite; }

    /* Range slider thumbs spring on change */
    input[type="range"]::-webkit-slider-thumb { transition: transform .5s var(--md-ease-spatial); }
    input[type="range"]::-moz-range-thumb { transition: transform .5s var(--md-ease-spatial); }

    @media (prefers-reduced-motion: reduce) {
        .control-section,
        .effect-btn,
        .color-preset,
        .power-button,
        .effect-btn.active,
        .status-dot,
        input[type="range"]::-webkit-slider-thumb,
        input[type="range"]::-moz-range-thumb {
            animation: none !important;
            transition: none !important;
        }
    }

    /* ===== Obsessive-Detail Politur (2026-06-16) — additiv, kein Umbau =====
       Klammer: tonale MD3-Flächen, die unter dem Cursor Licht fangen. ===== */
    :root{ --ease-quick:cubic-bezier(.2,0,0,1); }
    button:focus-visible,a[href]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible,[tabindex]:not([tabindex="-1"]):focus-visible{
      outline:2px solid var(--accent-blue, var(--md-primary, var(--primary, #aac7ff)))!important; outline-offset:3px!important;
    }
    button:focus:not(:focus-visible),a:focus:not(:focus-visible),[role="button"]:focus:not(:focus-visible){ outline:none; }
    h1,h2,h3{ text-wrap:balance; }
    @media (pointer:coarse){ button,.btn,[role="button"]{ min-height:44px; } }
    @media (hover:hover) and (pointer:fine){
      .control-section{ position:relative; }
      .control-section::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
        opacity:0; transition:opacity 240ms var(--ease-quick);
        background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),
          color-mix(in srgb, var(--accent-blue, var(--md-primary, var(--primary,#aac7ff))) 13%, transparent), transparent 60%); }
      .control-section:hover::after{ opacity:1; }
    }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; }
      .control-section::after{ display:none!important; }
    }
    
/* ---- Statusanzeige: Referenzform (siehe shared/theme.css .sh-live) --------
   Punkt + Wort in einer Pille. Gruen = Verbindung steht. Die Textbreite ist
   fixiert, weil das Wort wechselt und die paar Pixel Unterschied sonst
   Nachbar-Elemente auf schmalen Breiten umbrechen lassen. */
.status-indicator{
  display:inline-flex; align-items:center; gap:.45rem;
  color:var(--sh-text2); font-size:.82rem; font-weight:400;
  padding:.4rem .7rem; border-radius:var(--sh-pill);
  border:1px solid var(--sh-outline);
  background:color-mix(in srgb, var(--sh-text) 3%, transparent);
  min-width:0;
}
.status-indicator::before{
  content:''; width:8px; height:8px; border-radius:50%;
  background:var(--sh-muted); flex:0 0 auto;
}
.status-connected{ background:color-mix(in srgb, var(--sh-text) 3%, transparent);
                   color:var(--sh-text2); }
.status-connected::before{ background:var(--sh-ok); box-shadow:0 0 10px var(--sh-ok); }
.status-disconnected{ background:color-mix(in srgb, var(--sh-text) 3%, transparent);
                      color:var(--sh-text2); }
.status-disconnected::before{ background:var(--sh-muted); box-shadow:none; }
</style>
    <script src="/shared/icons.js?v=7" defer></script>
    <script src="/shared/nav.js?v=17" defer blocking="render"></script>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="sh-icon" data-sh-icon="rainbow" aria-hidden="true" style="vertical-align:-0.12em;margin-right:.35rem"></span> Lichtwerk Controller</h1>
            <div class="status-indicator" id="status-indicator">
                <span id="status-text">verbinde…</span>
                <div class="status-dot" id="status-dot"></div>
            </div>
        </header>

        <main>
            <!-- Power Control -->
            <section class="control-section">
                <h3>Stromversorgung</h3>
                <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
                    <div class="power-button" id="power-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v10M5.25 8.25A7.5 7.5 0 1 0 18.75 8.25" stroke-linecap="round"></path>
                        </svg>
                    </div>
                    <p style="text-align: center; color: var(--text-secondary); margin-top: var(--spacing-3);">
                        Power Ein/Aus
                    </p>
                </div>
            </section>

            <!-- Color Picker -->
            <section class="control-section">
                <h3>Color Control</h3>
                <div class="color-picker-container">
                    <div class="color-display" id="color-display"></div>
                    <div class="color-inputs">
                        <div class="color-input-group">
                            <label for="red-slider">Red</label>
                            <input type="range" id="red-slider" min="0" max="255" value="255">
                            <input type="number" id="red-value" min="0" max="255" value="255">
                        </div>
                        <div class="color-input-group">
                            <label for="green-slider">Green</label>
                            <input type="range" id="green-slider" min="0" max="255" value="255">
                            <input type="number" id="green-value" min="0" max="255" value="255">
                        </div>
                        <div class="color-input-group">
                            <label for="blue-slider">Blue</label>
                            <input type="range" id="blue-slider" min="0" max="255" value="255">
                            <input type="number" id="blue-value" min="0" max="255" value="255">
                        </div>
                    </div>
                </div>
                
                <!-- Predefined Colors -->
                <div class="predefined-colors">
                    <div class="color-preset" data-color="255,0,0" style="background-color: rgb(255,0,0);"></div>
                    <div class="color-preset" data-color="0,255,0" style="background-color: rgb(0,255,0);"></div>
                    <div class="color-preset" data-color="0,0,255" style="background-color: rgb(0,0,255);"></div>
                    <div class="color-preset" data-color="255,255,0" style="background-color: rgb(255,255,0);"></div>
                    <div class="color-preset" data-color="255,0,255" style="background-color: rgb(255,0,255);"></div>
                    <div class="color-preset" data-color="0,255,255" style="background-color: rgb(0,255,255);"></div>
                    <div class="color-preset" data-color="255,128,0" style="background-color: rgb(255,128,0);"></div>
                    <div class="color-preset" data-color="128,0,255" style="background-color: rgb(128,0,255);"></div>
                    <div class="color-preset" data-color="255,255,255" style="background-color: rgb(255,255,255);"></div>
                    <div class="color-preset" data-color="255,192,203" style="background-color: rgb(255,192,203);"></div>
                    <div class="color-preset" data-color="173,216,230" style="background-color: rgb(173,216,230);"></div>
                    <div class="color-preset" data-color="144,238,144" style="background-color: rgb(144,238,144);"></div>
                    <div class="color-preset" data-color="255,218,185" style="background-color: rgb(255,218,185);"></div>
                    <div class="color-preset" data-color="221,160,221" style="background-color: rgb(221,160,221);"></div>
                    <div class="color-preset" data-color="255,182,193" style="background-color: rgb(255,182,193);"></div>
                    <div class="color-preset" data-color="64,224,208" style="background-color: rgb(64,224,208);"></div>
                    <div class="color-preset" data-color="255,215,0" style="background-color: rgb(255,215,0);"></div>
                    <div class="color-preset" data-color="128,128,128" style="background-color: rgb(128,128,128);"></div>
                </div>
                
                <!-- Color Mode for Theater Effect -->
                <div class="color-mode-control" id="color-mode-control" style="display: none; margin-top: 20px;">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="color-mode-checkbox" checked>
                        <span id="color-mode-label">Rainbow Mode (uncheck for single color)</span>
                    </label>
                </div>
            </section>

            <!-- Effects -->
            <section class="control-section">
                <h3>Effects</h3>
                <div class="effects-grid">
                    <button class="effect-btn active" data-effect="solid">Solid</button>
                    <button class="effect-btn" data-effect="rainbow">Rainbow</button>
                    <button class="effect-btn" data-effect="pulse">Pulse</button>
                    <button class="effect-btn" data-effect="chase">Chase</button>
                    <button class="effect-btn" data-effect="sparkle">Sparkle</button>
                    <button class="effect-btn" data-effect="strobe">Strobe</button>
                    <button class="effect-btn" data-effect="meteor">Meteor</button>
                    <button class="effect-btn" data-effect="breathe">Breathe</button>
                    <button class="effect-btn" data-effect="sinelon">Sinelon</button>
                    <button class="effect-btn" data-effect="juggle">Juggle</button>
                    <button class="effect-btn" data-effect="theater">Theater</button>
                    <button class="effect-btn" data-effect="gradient">Gradient</button>
                    <button class="effect-btn" data-effect="fire">Fire</button>
                </div>
            </section>

            <!-- Brightness Control -->
            <section class="control-section">
                <h3>Brightness</h3>
                <div class="slider-container">
                    <input type="range" id="brightness-slider" min="0" max="255" value="100">
                    <div class="slider-value" id="brightness-value">100</div>
                </div>
            </section>

            <!-- Speed Control -->
            <section class="control-section">
                <h3>Speed / Intensity</h3>
                <div class="slider-container">
                    <input type="range" id="speed-slider" min="1" max="100" value="50">
                    <div class="slider-value" id="speed-value">50</div>
                </div>
            </section>

            <!-- System Info -->
            <section class="control-section">
                <h3>System Information</h3>
                <div class="system-info">
                    <div class="info-item">
                        <span class="info-label">LED Count:</span>
                        <span class="info-value" id="led-count">--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">GPIO Pin:</span>
                        <span class="info-value" id="gpio-pin">--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Current Effect:</span>
                        <span class="info-value" id="current-effect">--</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="static/js/app.js"></script>
<script>/* cursor-sheen (gated, rAF-throttled, additiv) */
(function(){try{
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var sel='.control-section',el=null,x=0,y=0,q=false;
  function f(){q=false;if(!el)return;var r=el.getBoundingClientRect();
    el.style.setProperty('--mx',((x-r.left)/r.width*100)+'%');
    el.style.setProperty('--my',((y-r.top)/r.height*100)+'%');}
  document.addEventListener('pointermove',function(e){
    var c=e.target.closest?e.target.closest(sel):null;el=c;x=e.clientX;y=e.clientY;
    if(c&&!q){q=true;requestAnimationFrame(f);}
  },{passive:true});
}catch(_){}})();</script>
</body>
</html>
